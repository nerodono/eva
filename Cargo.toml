[package]
name = "eva"
version = "0.1.0"
edition = "2024"
license.workspace = true

[workspace]
members = ["core", "core/macros", "data", "data/macros", "handlers", "handlers/macros", "rt", "macros-common", "utils"]
resolver = "3"

[workspace.package]
license = "WTFPL"

[features]
default = ["handlers"]
handlers = ["dep:eva-handlers"]
rt = ["dep:eva-rt"]
cli = ["rt", "eva-rt/cli"]
figment = ["rt", "eva-rt/figment"]
yaml = ["rt", "eva-rt/yaml"]
logforth = ["rt", "eva-rt/logforth"]
otel = ["rt", "eva-rt/otel"]
enable-tracing = ["eva-handlers?/enable-tracing", "eva-rt?/enable-tracing"]
get_time_test = ["eva-core/get_time_test"]

[dependencies]
eva-core = { path = "core" }
eva-handlers = { path = "handlers", optional = true, features = ["macros"] }
eva-rt = { path = "rt", optional = true }

[dev-dependencies]
fastrace.workspace = true

[workspace.dependencies.schemars]
version = "1"
default-features = false
features = [
    "std",
    "derive",
]

[workspace.dependencies]
proc-macro2 = { version = "1.0.101", features = ["span-locations"] }
syn = { version = "2.0.104", features = ["full"] }
quote = "1.0.40"
heck = "0.5.0"
proc-macro-crate = "3.4.0"
serde_json = "1"
trybuild = "1.0.121"
postcard = { version = "1.1.1", features = ["use-std"] }

serde = { version = "1.0", features = ["derive"] }

trait-set = "0.3.0"

compact_str = { version = "0.10", features = ["serde", "schemars"] }
paste = "1.0.15"
rand = "0.9.1"
rand_xoshiro = { version = "0.7.0", features = ["serde"] }
hashbrown = { version = "0.17", default-features = false, features = ["serde", "inline-more", "equivalent"] }
ahash = "0.8.11"
perfect-derive = "0.1.5"

seq-macro = "0.3.6"
bytesize = { version = "2.0.1", features = ["serde"] }
bytes = { version = "1.10.1", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
blake3 = "1.8.2"

clap = { version = "4.5.47", features = ["derive"] }
figment = { version = "0.10.19" }
tokio = { version = "1.47.1", features = ["rt", "sync", "macros", "signal"] }
eyre = { version = "0.6.12" }
either = "1.15.0"
humantime = "2.3.0"

log = { version = "0.4.28", features = ["kv", "std"] }
logforth = { version = "0.28.1", default-features = false, features = ["append-fastrace", "append-file", "bridge-log", "layout-text", "layout-json", "append-async", "diagnostic-fastrace"] }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = ["logs", "http-json", "reqwest-blocking-client"] }
fastrace = "0.7.14"
pin-project-lite = "0.2.16"
base64 = { version = "0.22.1" }
