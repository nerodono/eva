[package]
name = "eva"
version = "0.1.0"
edition = "2024"
license.workspace = true

[workspace]
members = ["macros", "utils"]

[workspace.package]
license = "WTFPL"

[workspace.dependencies]
proc-macro2 = "1.0.95"
syn = "2.0.104"
quote = "1.0.40"

[features]
default = []
cli = [
    "tokio/rt-multi-thread",
    "dep:clap",
    "dep:figment",
    "figment/json",
    "figment/toml",
    "figment/env",
    "logforth",
]
yaml = ["cli", "figment/yaml"]
enable-tracing = ["fastrace/enable"]
logforth = ["dep:logforth", "tokio"]
otel = [
    "logforth",
    "logforth/append-opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:base64",
]
tokio = ["dep:tokio", "dep:fastrace"]
# Very long running.
get_time_test = []

[dependencies.schemars]
version = "1"
default-features = false
features = [
    "std",
    "derive",
    "bytes1",
    "url2",
]

[dependencies]
eva-macros.path = "./macros"
eva-utils.path = "./utils"

serde = { version = "1.0", features = ["derive"] }

trait-set = "0.3.0"

compact_str = { version = "0.10", features = ["serde", "schemars"] }
paste = "1.0.15"
rand = "0.9.1"
rand_xoshiro = { version = "0.7.0", features = ["serde"] }
hashbrown = { version = "0.17", default-features = false, features = ["serde", "inline-more", "equivalent"] }
ahash = "0.8.11"
perfect-derive = "0.1.5"

seq-macro = "0.3.6"
bytesize = { version = "2.0.1", features = ["serde"] }
bytes = { version = "1.10.1", features = ["serde"] }
url = { version = "2.5.4", features = ["serde"] }
blake3 = "1.8.2"

clap = { version = "4.5.47", features = ["derive"], optional = true }
figment = { version = "0.10.19", optional = true }
tokio = { version = "1.47.1", features = ["rt", "sync", "macros", "signal"], optional = true }
eyre = { version = "0.6.12" }
either = "1.15.0"
humantime = "2.3.0"

log = { version = "0.4.28", features = ["kv", "std"] }
logforth = { version = "0.28.1", default-features = false, features = ["append-fastrace", "append-file", "bridge-log", "layout-text", "layout-json", "append-async", "diagnostic-fastrace"], optional = true }
opentelemetry-otlp = { version = "0.31.0", default-features = false, features = ["logs", "http-json", "reqwest-blocking-client"], optional = true }
fastrace = { version = "0.7.14", optional = true }
pin-project-lite = "0.2.16"
base64 = { version = "0.22.1", optional = true }

[dev-dependencies]
serde_json = "1"
postcard = { version = "1.1.1", features = ["use-std"] }
