[package]
name = "eva-macros"
version = "0.1.0"
edition = "2024"
license.workspace = true

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["full", "visit-mut"] }
quote = { workspace = true }
proc-macro2.workspace = true

heck = "0.5.0"

[dev-dependencies]
# Cyclic dev-dependency: lets doctests and tests expand the macros against
# the real `::eva` crate.
eva = { path = ".." }
serde_json = "1"
trybuild = "1.0.121"
